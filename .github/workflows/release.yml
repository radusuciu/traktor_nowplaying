# modified heavily from the poetry project https://github.com/python-poetry/poetry

name: Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:

  Verify:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Check that the tag matches the package version
      run: |
        tag="${GITHUB_REF#refs/tags/v}"
        version="$(sed -n "s/^__version__ = '\(.*\)'$/\1/p" traktor_nowplaying/version.py)"
        if [ "$tag" != "$version" ]; then
          echo "Tag v$tag does not match traktor_nowplaying/version.py ($version)"
          exit 1
        fi

  Linux:
    needs: Verify
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Get tag
      id: tag
      run: |
        echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    - name: Building release
      run: |
        pyinstaller traktor_nowplaying/cli.py -n traktor_nowplaying --onefile --icon=assets/icon.ico
    - name: Zipping release
      run: |
        tar -czvf traktor_nowplaying-${{ steps.tag.outputs.tag }}-linux.tar.gz README.md -C dist traktor_nowplaying
    - name: Upload release file
      uses: actions/upload-artifact@v7
      with:
        name: traktor_nowplaying-${{ steps.tag.outputs.tag }}-linux.tar.gz
        path: traktor_nowplaying-${{ steps.tag.outputs.tag }}-linux.tar.gz

  MacOS:
    needs: Verify
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Get tag
      id: tag
      run: |
        echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    - name: Building release
      run: |
        pyinstaller traktor_nowplaying/cli.py -n traktor_nowplaying --onefile --icon=assets/icon.ico
    - name: Zipping release
      run: |
        tar -czvf traktor_nowplaying-${{ steps.tag.outputs.tag }}-macos.tar.gz README.md -C dist traktor_nowplaying
    - name: Upload release file
      uses: actions/upload-artifact@v7
      with:
        name: traktor_nowplaying-${{ steps.tag.outputs.tag }}-macos.tar.gz
        path: traktor_nowplaying-${{ steps.tag.outputs.tag }}-macos.tar.gz

  Windows:
    needs: Verify
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Get tag
      id: tag
      shell: bash
      run: |
        echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    - name: Building release
      run: |
        pyinstaller traktor_nowplaying/cli.py -n traktor_nowplaying --onefile --icon=assets/icon.ico
    - name: Zipping release
      run: |
        7z a traktor_nowplaying-${{ steps.tag.outputs.tag }}-win.zip README.md .\dist\traktor_nowplaying.exe
    - name: Upload release file
      uses: actions/upload-artifact@v7
      with:
        name: traktor_nowplaying-${{ steps.tag.outputs.tag }}-win.zip
        path: traktor_nowplaying-${{ steps.tag.outputs.tag }}-win.zip

  PyPI:
    # Publish to PyPI only once every binary has built, and before the GitHub
    # release is created, so a failure here does not leave a half-done release.
    needs: [Linux, MacOS, Windows]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  Release:
    needs: PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get tag
        id: tag
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Download Linux release file
        uses: actions/download-artifact@v8
        with:
          name: traktor_nowplaying-${{ steps.tag.outputs.tag }}-linux.tar.gz
          path: ./

      - name: Download MacOS release file
        uses: actions/download-artifact@v8
        with:
          name: traktor_nowplaying-${{ steps.tag.outputs.tag }}-macos.tar.gz
          path: ./

      - name: Download Windows release file
        uses: actions/download-artifact@v8
        with:
          name: traktor_nowplaying-${{ steps.tag.outputs.tag }}-win.zip
          path: ./

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            traktor_nowplaying-${{ steps.tag.outputs.tag }}-linux.tar.gz
            traktor_nowplaying-${{ steps.tag.outputs.tag }}-macos.tar.gz
            traktor_nowplaying-${{ steps.tag.outputs.tag }}-win.zip
